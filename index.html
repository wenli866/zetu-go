<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>择途 · 正在打开</title>
<style>
  :root { --bg: #f4f4f5; --card: #fff; --text: #141416; --sub: #6b6b70; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0f11; --card: #1c1c1f; --text: #f4f4f5; --sub: #a1a1a8; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { width: min(420px, 100%); padding: 32px 24px; border-radius: 20px; background: var(--card); text-align: center; }
  h1 { margin: 0 0 4px; font-family: "Songti SC", "SimSun", serif; font-size: 34px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; color: #fff; background: linear-gradient(135deg, #4f46e5, #7c3aed, #db2777); vertical-align: middle; }
  p { color: var(--sub); line-height: 1.6; font-size: 14px; }
  a.btn { display: block; margin-top: 16px; padding: 14px; border-radius: 14px; color: #fff; text-decoration: none; font-weight: 600;
    background: linear-gradient(135deg, #4f46e5, #7c3aed 60%, #db2777); }
  small { display: block; margin-top: 18px; color: var(--sub); font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>择途 <span class="tag">公测</span></h1>
  <p>帮大学生把有限的时间，投到最值得的地方</p>
  <p id="msg">正在跳转到择途…<br>没有自动打开的话，点下面的按钮</p>
  <a class="btn" id="go" href="https://api.trycloudflare.com/?invite=ZETU-QM23">进入择途</a>
  <small>当前服务器地址更新于 10-15 09:01<br>二维码长期有效：服务器地址变了，这个页面会自动指向新地址。</small>
</main>
<script>
  // 这个页面放在 GitHub Pages 上，地址固定，二维码印它。真正的服务器是临时网址，变了就由 scripts/go_link.sh 改这里。
  // 2026-10-14 晚：原来先探测服务器再跳，部分手机（微信内置浏览器）探测一直没有结果 → 一直转圈。现在直接跳，不转圈。
  // 2026-10-14 深夜：后台看板也走这个固定地址 —— …/zetu-go/#admin=密钥 → 服务器的 /admin/密钥。
  // 密钥放在 # 后面，浏览器不会把它发给 GitHub，只在跳转时交给我们自己的服务器。
  var m = /^#admin=([A-Za-z0-9_-]{16,64})$/.exec(location.hash);
  if (m) document.getElementById('go').href = 'https://api.trycloudflare.com/admin/' + m[1];
  setTimeout(function () { location.replace(document.getElementById('go').href); }, 200);
</script>
</body>
</html>
